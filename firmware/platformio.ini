[platformio]
src_dir = esp32
default_envs = robot, joystick

[env:robot]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<robot.cpp>
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1
extra_scripts = pre:hardware_profile.py
custom_hardware_mode = disabled

[env:robot-calibration]
extends = env:robot
custom_hardware_mode = calibration

[env:robot-calibrated]
extends = env:robot
custom_hardware_mode = run

; Wireless (OTA) uploads once the robot runs an OTA-capable build and is on Wi-Fi.
; Needs GRASSROOT_OTA_PASSWORD in the environment (kept in the git-ignored .env).
[env:robot-calibration-ota]
extends = env:robot-calibration
upload_protocol = espota
upload_port = grassroot-robot.local
upload_flags = --auth=${sysenv.GRASSROOT_OTA_PASSWORD}

[env:robot-calibrated-ota]
extends = env:robot-calibrated
upload_protocol = espota
upload_port = grassroot-robot.local
upload_flags = --auth=${sysenv.GRASSROOT_OTA_PASSWORD}

[env:joystick]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<joystick.cpp>
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags =
  -DJOYSTICK_X_PIN=1
  -DJOYSTICK_Y_PIN=2
  -DJOYSTICK_BUTTON_PIN=3
  -DARDUINO_USB_CDC_ON_BOOT=1
