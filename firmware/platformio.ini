[platformio]
src_dir = esp32

[env:robot]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = +<robot.cpp>
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1
; Outputs remain disabled. Add -DGRASSROOT_WIRING_VERIFIED=1 ONLY after bench checks.
build_flags = -DGRASSROOT_WIRING_VERIFIED=0

[env:joystick]
platform = espressif32@6.9.0
; Build target only. Confirm actual second ESP32-S3 board before uploading.
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<joystick.cpp>
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson@7.2.1
; Set JOYSTICK_X_PIN/Y_PIN/BUTTON_PIN only after the wiring commit.
