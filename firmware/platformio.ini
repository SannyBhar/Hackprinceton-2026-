[platformio]
src_dir = esp32/codeanywhere

[env:robot]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@2.6.1
  bblanchon/ArduinoJson@7.2.1
; Outputs remain disabled. Add -DGRASSROOT_WIRING_VERIFIED=1 ONLY after bench checks.
build_flags = -DGRASSROOT_WIRING_VERIFIED=0
